server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/arogyatrack?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Python ML Service Integration URL
arogyatrack.ml-service.url=http://localhost:5000

# Security / JWT Configuration (256-bit key)
arogyatrack.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
arogyatrack.jwt.expiration-ms=86400000

# Logging
logging.level.com.arogyatrack=INFO
logging.level.org.springframework.security=INFO
