name: ArogyaTrack CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Frontend (React + Vite) Build & Quality Check
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Production Frontend
        run: npm run build

      - name: Upload Production Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arogyatrack-frontend-build
          path: frontend/dist/
          retention-days: 7

  # -------------------------------------------------------------
  # Job 2: Backend (Spring Boot 3 + Java 21) Build & Package
  # -------------------------------------------------------------
  backend-build:
    name: Backend (Spring Boot + Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile and Package Spring Boot Application
        run: mvn -B clean package -DskipTests

      - name: Upload Backend Executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: arogyatrack-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # -------------------------------------------------------------
  # Job 3: Machine Learning Service (Python 3.11 + Scikit-Learn)
  # -------------------------------------------------------------
  ml-service-verify:
    name: ML Service (Python + Scikit-Learn Models)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml-service/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train and Validate Models
        run: python src/train.py

      - name: Run ML Service Unit Tests
        run: python test_service.py
