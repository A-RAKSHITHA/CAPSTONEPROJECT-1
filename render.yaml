services:
  # 1. Machine Learning Inference Microservice (Python Flask + Scikit-Learn)
  - type: web
    name: arogyatrack-ml
    env: docker
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
    plan: free
    healthCheckPath: /health

  # 2. Spring Boot REST API Backend (Java 21)
  - type: web
    name: arogyatrack-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: arogyatrack-ml
          property: host

  # 3. React Vite Single Page Frontend
  - type: web
    name: arogyatrack-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: arogyatrack-backend
          property: host
